<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mudita & Santosh | Reveal</title>
    <style>
        :root {
            --sand-engrave: rgba(68, 60, 47, 0.7);
            --wax-red: #9b2226;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: 'Georgia', serif;
            background-color: #d4c3a3;
        }

        /* Frame 1: Mirissa Beach Background */
        #app-container {
            position: relative; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            /* High-quality Mirissa Beach reference image */
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), 
                        url('https://images.unsplash.com/photo-1586500036065-9d485073005a?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            cursor: pointer;
        }

        /* The Wax Seal */
        #seal-wrapper {
            z-index: 100; text-align: center;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #seal {
            width: 130px; height: 130px;
            background: var(--wax-red);
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.6);
            display: flex; justify-content: center; align-items: center;
            margin: 0 auto 20px;
            font-size: 50px;
        }

        .instruction {
            color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            font-style: italic; animation: breathe 2s infinite ease-in-out;
        }

        /* Frame 3: The Sequential Reveal */
        #reveal-layer {
            position: absolute; width: 100%; height: 100%;
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; z-index: 10;
            background: url('https://www.transparenttextures.com/patterns/sandpaper.png'); /* Sand texture for reveal */
            background-color: #e2d1b3;
        }

        .reveal-item { opacity: 0; transition: opacity 1.5s ease; }

        .names { font-size: 2.2rem; color: #4a4235; margin-bottom: 10px; }
        .location { font-size: 1.1rem; color: #7a6e5a; letter-spacing: 4px; margin-bottom: 40px; }
        
        /* Engraved Date Effect */
        .date-engraved {
            font-size: 2.8rem; font-weight: bold;
            color: var(--sand-engrave);
            text-shadow: -1px -1px 1px rgba(0,0,0,0.3), 1px 1px 1px rgba(255,255,255,0.4);
            letter-spacing: 3px;
        }

        #wave-canvas {
            position: absolute; top: 0; left: 0;
            z-index: 50; pointer-events: none;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .seal-vanish { transform: scale(0.5); opacity: 0; filter: blur(10px); }
    </style>
</head>
<body>

<div id="app-container" onclick="startSequence()">
    <div id="seal-wrapper">
        <div id="seal">🐚</div>
        <p class="instruction">Tap to reveal our special date</p>
    </div>

    <div id="reveal-layer">
        <div id="item-names" class="reveal-item names">Mudita & Santosh</div>
        <div id="item-location" class="reveal-item location">GOA, INDIA</div>
        <div id="item-date" class="reveal-item date-engraved">23 · 11 · 2026</div>
    </div>

    <canvas id="wave-canvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('wave-canvas');
    const ctx = canvas.getContext('2d');
    let active = false;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function startSequence() {
        if(active) return;
        active = true;

        // 1. Shrink and fade the seal
        document.getElementById('seal-wrapper').classList.add('seal-vanish');

        setTimeout(() => {
            document.getElementById('seal-wrapper').style.display = 'none';
            document.getElementById('reveal-layer').style.display = 'flex';
            runWave();
        }, 800);
    }

    function runWave() {
        let y = 0;
        const speed = 7;

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Water Layer
            ctx.fillStyle = "rgba(230, 245, 255, 0.85)";
            ctx.beginPath();
            ctx.moveTo(0, y);
            for (let i = 0; i <= canvas.width; i += 15) {
                ctx.lineTo(i, y + Math.sin(i * 0.03 + y * 0.05) * 15);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();

            // Foam Edge
            ctx.strokeStyle = "white";
            ctx.lineWidth = 10;
            ctx.stroke();

            y += speed;

            // Sequential Triggering based on wave position
            if (y > canvas.height * 0.3) document.getElementById('item-names').style.opacity = 1;
            if (y > canvas.height * 0.5) document.getElementById('item-location').style.opacity = 1;
            if (y > canvas.height * 0.7) document.getElementById('item-date').style.opacity = 1;

            if (y < canvas.height + 100) {
                requestAnimationFrame(draw);
            }
        }
        draw();
    }
</script>
</body>
</html>
